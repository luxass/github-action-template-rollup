ignoreScripts: true
catalogMode: prefer
minimumReleaseAge: 5760
trustPolicy: no-downgrade
strictDepBuilds: true
blockExoticSubdeps: true
minimumReleaseAgeExclude:
  # Renovate security update: pnpm@11.8.0 || 11.11.0
  - pnpm@11.8.0 || 11.11.0

catalogs:
  runtime:
    "@actions/core": 3.0.1

  dev:
    "@rollup/plugin-commonjs": 29.0.3
    "@rollup/plugin-json": 6.1.0
    "@rollup/plugin-node-resolve": 16.0.3
    "@rollup/plugin-typescript": 12.3.1
    oxfmt: 0.76.0
    oxlint: 1.91.0
    oxlint-tsgolint: 7.0.2005
    rollup: 4.67.4
    tslib: 2.9.1
    typescript: 6.0.3

  types:
    "@types/node": 26.6.6
